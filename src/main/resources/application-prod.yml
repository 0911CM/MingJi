# ============================================================
# MingJi · Railway 云端部署配置
#
# Railway 会自动注入以下 MySQL 环境变量（无需手动填）：
#   MYSQL_URL        jdbc:mysql://... 完整 JDBC 连接串
#   MYSQL_USER       数据库用户名
#   MYSQL_PASSWORD   数据库密码
# 若 Railway 未自动注入，也可手动在环境变量填 MINGJI_DB_*
# ============================================================

server:
  port: ${PORT:8080}          # Railway 自动注入 PORT
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  # 数据源：优先读 Railway 注入的 MYSQL_URL，其次用户自定义
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:${MINGJI_DB_URL:jdbc:mysql://localhost:3306/mingji?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}}
    username: ${MYSQL_USER:${MINGJI_DB_USERNAME:root}}
    password: ${MYSQL_PASSWORD:${MINGJI_DB_PASSWORD:}}

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # Thymeleaf（云端开启缓存）
  thymeleaf:
    cache: true
    encoding: UTF-8
    mode: HTML

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# 自定义配置（Railway 免费版无磁盘，图片上传用临时目录）
mingji:
  upload-dir: ${MINGJI_UPLOAD_DIR:/tmp/mingji-uploads/}