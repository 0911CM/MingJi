server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 365d
      cookie:
        max-age: 365d
        http-only: true
        same-site: strict

spring:
  application:
    name: mingji

  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mingji?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password:

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Thymeleaf
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML

  # 静态资源
  web:
    resources:
      static-locations: classpath:/static/,file:${mingji.upload-dir}

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# 自定义配置
mingji:
  upload-dir: F:/Computer/Projects/MingJi/uploads/
  security:
    password-hash: ${MINGJI_ACCESS_PASSWORD_HASH:}
    remember-key: ${MINGJI_REMEMBER_KEY:}
    secure-cookie: ${MINGJI_SECURE_COOKIE:false}
