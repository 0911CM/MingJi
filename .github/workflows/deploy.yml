# ============================================================
# MingJi CI/CD · GitHub Actions 自动部署
# 触发：每次 push 到 master 分支
# 流程：SSH 到服务器 → 拉取最新代码 → 执行部署脚本
# ============================================================

name: Deploy MingJi

on:
  push:
    branches: [ master ]
  workflow_dispatch:    # 支持手动触发

concurrency:
  group: mingji-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Aliyun Server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_PASSWORD" ]; then
            echo "❌ 错误：SERVER_HOST 或 SERVER_PASSWORD Secrets 未配置！"
            echo "请到 GitHub 仓库 → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✅ Secrets 配置正确"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package
        run: bash ./mvnw -B package

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to Aliyun Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          if [ "$fingerprint" != "SHA256:4CDEgQug7DDPR8gPq/DN15Sxfe5Xyl4PvYulUccCYug" ]; then
            echo "❌ 服务器 SSH 指纹不匹配，停止部署"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh_options=(-o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          sshpass -e ssh "${ssh_options[@]}" root@"$SERVER_HOST" \
              'cd /opt/MingJi &&
               pulled=false &&
               for attempt in 1 2 3; do
                 if git -c http.version=HTTP/1.1 pull --ff-only; then pulled=true; break; fi
                 echo "Git 拉取失败，第 ${attempt} 次重试..."
                 sleep 5
               done &&
               [ "$pulled" = true ] && mkdir -p target'
          sshpass -e scp "${ssh_options[@]}" target/mingji-0.1.0.jar \
              root@"$SERVER_HOST":/opt/MingJi/target/mingji-0.1.0.jar.upload
          sshpass -e ssh "${ssh_options[@]}" root@"$SERVER_HOST" \
              'cd /opt/MingJi &&
               mv target/mingji-0.1.0.jar.upload target/mingji-0.1.0.jar &&
               bash deploy.sh'

      - name: Verify Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          response_code=$(sshpass -e ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@"$SERVER_HOST" \
              "curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1:6911/access")
          if [ "$response_code" != "200" ]; then
            echo "❌ 健康检查失败，HTTP 状态码：$response_code"
            exit 1
          fi
          echo "========================================="
          echo "  ✅ 部署完成！"
          echo "  📱 访问地址: http://$SERVER_HOST"
          echo "  🔒 站点密码门禁工作正常"
          echo "========================================="
